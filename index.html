<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HTML5 Music Sequencer</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0d1117;color:#e6edf3;font-family:'Courier New',monospace;min-height:100vh;display:flex;flex-direction:column;user-select:none}

/* ── Transport ── */
#transport{background:#161b22;padding:10px 20px;display:flex;align-items:center;gap:16px;border-bottom:1px solid #21262d;flex-wrap:wrap}
.app-title{font-size:16px;font-weight:bold;color:#58a6ff;letter-spacing:3px;flex-shrink:0}
.t-group{display:flex;align-items:center;gap:8px}
.t-label{font-size:11px;color:#8b949e}
.btn{padding:6px 14px;border:1px solid #30363d;border-radius:5px;background:#21262d;color:#e6edf3;cursor:pointer;font-size:12px;font-family:inherit;transition:all .1s}
.btn:hover{background:#30363d;border-color:#484f58}
.btn.active{background:#1f6feb;border-color:#388bfd;color:#fff;box-shadow:0 0 8px #1f6feb60}
.btn.danger{border-color:#f8514960;color:#f85149}
.btn.danger:hover{background:#f8514918}
.bpm-val{font-size:22px;color:#58a6ff;min-width:46px;text-align:center;line-height:1}
input[type=range]{accent-color:#58a6ff;cursor:pointer}
#step-indicator{font-size:11px;color:#484f58;margin-left:auto;font-variant-numeric:tabular-nums;flex-shrink:0}

/* ── Tabs ── */
#tabs{display:flex;background:#161b22;border-bottom:1px solid #21262d;padding:0 16px}
.tab{padding:9px 18px;cursor:pointer;font-size:12px;color:#8b949e;border-bottom:2px solid transparent;transition:all .1s}
.tab:hover{color:#c9d1d9}
.tab.active{color:#58a6ff;border-bottom-color:#58a6ff}

/* ── Main ── */
#main{flex:1;padding:16px;overflow:auto}
.panel{display:none}
.panel.active{display:block}

/* ── Toolbar ── */
.toolbar{display:flex;gap:8px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.toolbar-label{font-size:11px;color:#8b949e;text-transform:uppercase;letter-spacing:1px}
.sep{width:1px;height:20px;background:#21262d;margin:0 4px}

/* ── Drum Sequencer ── */
.seq-channel{display:flex;align-items:center;margin-bottom:4px}
.ch-label{width:76px;font-size:10px;text-align:right;padding-right:10px;flex-shrink:0;letter-spacing:.5px}
.beats-wrap{display:flex;gap:5px}
.beat-group{display:flex;gap:3px}
.step-btn{width:34px;height:34px;border:1px solid #21262d;border-radius:4px;cursor:pointer;transition:background .05s,box-shadow .05s;background:#161b22;flex-shrink:0}
.step-btn:hover{background:#1c2128;border-color:#30363d}
.step-btn.on{border-color:transparent}
.step-btn.playhead{outline:2px solid #ffffff80;outline-offset:-1px}
.ch-controls{display:flex;align-items:center;gap:6px;margin-left:10px;flex-shrink:0}
.btn-sm{padding:3px 8px;font-size:10px;border:1px solid #30363d;border-radius:4px;background:transparent;color:#8b949e;cursor:pointer;font-family:inherit}
.btn-sm:hover{background:#21262d;color:#e6edf3}
.btn-sm.loaded{border-color:#3fb95060;color:#3fb950}
.step-nums{display:flex;gap:5px;margin-left:76px;margin-bottom:6px}
.beat-nums{display:flex;gap:3px}
.step-num{width:34px;text-align:center;font-size:9px;flex-shrink:0}

/* ── Piano Roll ── */
#pr-wrap{display:flex;overflow-x:auto}
#piano-keys{flex-shrink:0;display:flex;flex-direction:column}
.p-key{width:58px;height:20px;border:1px solid #21262d;display:flex;align-items:center;justify-content:flex-end;padding-right:6px;font-size:9px;cursor:pointer;flex-shrink:0;transition:background .05s}
.p-key.white{background:#161b22;color:#8b949e}
.p-key.black{background:#0d1117;color:#58a6ff60}
.p-key.white:hover,.p-key.black:hover{background:#1f6feb40}
.p-key.trigger{background:#1f6feb!important;color:#fff!important}
#pr-grid{display:flex;flex-direction:column}
.pr-row{display:flex}
.pr-cell{width:34px;height:20px;border-right:1px solid #1c2128;border-bottom:1px solid #1c2128;cursor:pointer;flex-shrink:0;transition:background .05s}
.pr-row.black .pr-cell{background:#0d1117}
.pr-row.white .pr-cell{background:#161b22}
.pr-cell:hover{background:#1f6feb30!important}
.pr-cell.on{background:#58a6ff!important;box-shadow:inset 0 0 6px #79c0ff}
.pr-cell.playhead{outline:2px solid #ffffff80;outline-offset:-1px}
.beat-left{border-left:1px solid #2a3040!important}
#pr-step-nums{display:flex;margin-left:58px;margin-bottom:4px}
.pr-snum{width:34px;text-align:center;font-size:9px;flex-shrink:0}

/* ── Synth Panel ── */
#synth-panel{margin-top:14px;padding:12px 16px;background:#161b22;border:1px solid #21262d;border-radius:6px;display:flex;gap:20px;flex-wrap:wrap;align-items:flex-end}
.sp-group{display:flex;flex-direction:column;align-items:center;gap:3px}
.sp-label{font-size:10px;color:#8b949e}
.sp-val{font-size:10px;color:#58a6ff;min-width:36px;text-align:center}
.sp-group select{background:#21262d;color:#e6edf3;border:1px solid #30363d;border-radius:4px;padding:3px 6px;font-size:11px;font-family:inherit;cursor:pointer}
.sp-group input[type=range]{width:72px;accent-color:#58a6ff}

/* ── Scrollbar ── */
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:#0d1117}
::-webkit-scrollbar-thumb{background:#30363d;border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:#484f58}
</style>
</head>
<body>

<!-- Transport -->
<div id="transport">
  <span class="app-title">◈ SEQUENCER</span>

  <div class="t-group">
    <button class="btn" id="btn-play" onclick="onPlay()">▶ PLAY</button>
    <button class="btn" id="btn-stop" onclick="onStop()">■ STOP</button>
    <button class="btn danger" onclick="clearAll()">✕ ALL CLEAR</button>
  </div>

  <div class="t-group">
    <span class="t-label">BPM</span>
    <input type="range" id="bpm-range" min="40" max="240" value="120" style="width:90px" oninput="setBpm(+this.value)">
    <span class="bpm-val" id="bpm-val">120</span>
  </div>

  <div class="t-group">
    <span class="t-label">VOL</span>
    <input type="range" id="vol-range" min="0" max="100" value="70" style="width:70px" oninput="setVol(+this.value)">
  </div>

  <div class="t-group">
    <span class="t-label">SWING</span>
    <input type="range" id="swing-range" min="0" max="50" value="0" style="width:60px" oninput="state.swing=+this.value">
  </div>

  <span id="step-indicator">STEP 1 / 16</span>
</div>

<!-- Tabs -->
<div id="tabs">
  <div class="tab active" onclick="switchTab('drums')">🥁 Drums</div>
  <div class="tab" onclick="switchTab('piano')">🎹 Piano Roll</div>
</div>

<!-- Main -->
<div id="main">

  <!-- Drum Panel -->
  <div class="panel active" id="panel-drums">
    <div class="toolbar">
      <span class="toolbar-label">Preset</span>
      <button class="btn" onclick="applyDrumPreset('basic')">Basic</button>
      <button class="btn" onclick="applyDrumPreset('hiphop')">Hip-Hop</button>
      <button class="btn" onclick="applyDrumPreset('techno')">Techno</button>
      <button class="btn" onclick="applyDrumPreset('reggae')">Reggae</button>
      <div class="sep"></div>
      <button class="btn" onclick="randomizeDrums()">🎲 Random</button>
      <div class="sep"></div>
      <span class="toolbar-label" style="margin-left:4px">Steps</span>
      <select style="background:#21262d;color:#e6edf3;border:1px solid #30363d;border-radius:4px;padding:3px 6px;font-size:12px;font-family:inherit;cursor:pointer" onchange="setSteps(+this.value)">
        <option value="8">8</option>
        <option value="16" selected>16</option>
        <option value="32">32</option>
      </select>
    </div>
    <div id="drum-seq"></div>
  </div>

  <!-- Piano Roll Panel -->
  <div class="panel" id="panel-piano">
    <div class="toolbar">
      <span class="toolbar-label">Preset</span>
      <button class="btn" onclick="applyPianoPreset('melody1')">Melody 1</button>
      <button class="btn" onclick="applyPianoPreset('arpeggio')">Arpeggio</button>
      <button class="btn" onclick="applyPianoPreset('blues')">Blues</button>
      <div class="sep"></div>
      <button class="btn" onclick="clearPiano()">✕ Clear</button>
      <div class="sep"></div>
      <span class="toolbar-label">Octaves</span>
      <select id="octave-sel" style="background:#21262d;color:#e6edf3;border:1px solid #30363d;border-radius:4px;padding:3px 6px;font-size:12px;font-family:inherit;cursor:pointer" onchange="setOctaves(+this.value)">
        <option value="1">1</option>
        <option value="2" selected>2</option>
        <option value="3">3</option>
      </select>
    </div>

    <div id="pr-step-nums"></div>
    <div id="pr-wrap">
      <div id="piano-keys"></div>
      <div id="pr-grid"></div>
    </div>

    <!-- Synth Controls -->
    <div id="synth-panel">
      <span style="font-size:10px;color:#8b949e;text-transform:uppercase;letter-spacing:1px">Synth</span>

      <div class="sp-group">
        <span class="sp-label">Waveform</span>
        <select id="osc-type" onchange="synthParams.wave=this.value">
          <option value="sawtooth">Saw</option>
          <option value="square">Square</option>
          <option value="sine">Sine</option>
          <option value="triangle">Triangle</option>
        </select>
      </div>

      <div class="sp-group">
        <span class="sp-label">ATTACK</span>
        <input type="range" min="1" max="200" value="5" oninput="synthParams.attack=+this.value;this.nextElementSibling.textContent=this.value+'ms'">
        <span class="sp-val">5ms</span>
      </div>
      <div class="sp-group">
        <span class="sp-label">DECAY</span>
        <input type="range" min="5" max="500" value="80" oninput="synthParams.decay=+this.value;this.nextElementSibling.textContent=this.value+'ms'">
        <span class="sp-val">80ms</span>
      </div>
      <div class="sp-group">
        <span class="sp-label">SUSTAIN</span>
        <input type="range" min="0" max="100" value="60" oninput="synthParams.sustain=this.value/100;this.nextElementSibling.textContent=this.value+'%'">
        <span class="sp-val">60%</span>
      </div>
      <div class="sp-group">
        <span class="sp-label">RELEASE</span>
        <input type="range" min="10" max="2000" value="200" oninput="synthParams.release=+this.value;this.nextElementSibling.textContent=this.value+'ms'">
        <span class="sp-val">200ms</span>
      </div>
      <div class="sp-group">
        <span class="sp-label">DETUNE</span>
        <input type="range" min="-50" max="50" value="0" oninput="synthParams.detune=+this.value;this.nextElementSibling.textContent=this.value+'ct'">
        <span class="sp-val">0ct</span>
      </div>
      <div class="sp-group">
        <span class="sp-label">OCT SHIFT</span>
        <select onchange="synthParams.octShift=+this.value">
          <option value="-1">-1</option>
          <option value="0" selected>0</option>
          <option value="1">+1</option>
          <option value="2">+2</option>
        </select>
      </div>

      <div class="sep" style="height:40px"></div>

      <div class="sp-group" style="align-items:flex-start">
        <span class="sp-label">WAV Sample</span>
        <input type="file" id="piano-file" accept=".wav,.mp3,.ogg,.flac" style="display:none" onchange="loadPianoSample(this)">
        <button class="btn" style="font-size:10px;padding:4px 10px" onclick="document.getElementById('piano-file').click()">📂 Load WAV</button>
        <span id="piano-sample-name" style="font-size:10px;color:#58a6ff;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap"></span>
        <label style="font-size:10px;color:#8b949e;cursor:pointer;margin-top:2px">
          <input type="checkbox" id="use-sample" onchange="synthParams.useSample=this.checked"> Use Sample
        </label>
      </div>
    </div>
  </div>
</div>

<script>
'use strict';

// ─────────────────────────────────────────────
// Global State
// ─────────────────────────────────────────────
const state = {
  bpm: 120,
  steps: 16,
  swing: 0,
  isPlaying: false,
  currentStep: -1,
  nextNoteTime: 0,
  timerID: null,
};

const LOOKAHEAD_MS = 25;
const SCHEDULE_SEC = 0.12;

// ─────────────────────────────────────────────
// Audio Context
// ─────────────────────────────────────────────
let actx = null, masterGain = null;

function ensureCtx() {
  if (!actx) {
    actx = new (window.AudioContext || window.webkitAudioContext)();
    masterGain = actx.createGain();
    masterGain.gain.value = 0.7;
    masterGain.connect(actx.destination);
  }
  if (actx.state === 'suspended') actx.resume();
  return actx;
}

function setVol(v) { if (masterGain) masterGain.gain.value = v / 100; }

// ─────────────────────────────────────────────
// Drum Channels
// ─────────────────────────────────────────────
const CHANNELS = [
  { id:'kick',    label:'KICK',    color:'#388bfd', desc:'bass drum' },
  { id:'snare',   label:'SNARE',   color:'#3fb950', desc:'snare drum' },
  { id:'hihat_c', label:'HIHAT C', color:'#e3b341', desc:'closed hi-hat' },
  { id:'hihat_o', label:'HIHAT O', color:'#ffd700', desc:'open hi-hat' },
  { id:'clap',    label:'CLAP',    color:'#ff7b72', desc:'clap' },
  { id:'tom_h',   label:'TOM H',   color:'#bc8cff', desc:'hi tom' },
  { id:'tom_l',   label:'TOM L',   color:'#9d5aff', desc:'lo tom' },
  { id:'bass',    label:'BASS',    color:'#ff9f43', desc:'bass synth' },
];

// drumPat[channelId] = Uint8Array(steps) where 1=on
let drumPat = {};
CHANNELS.forEach(c => { drumPat[c.id] = new Uint8Array(state.steps); });

// WAV samples per channel
const drumSamples = {};

// ─────────────────────────────────────────────
// Piano Roll State
// ─────────────────────────────────────────────
// pianoNotes[step] = Set of midi note numbers
let pianoNotes = Array.from({length: state.steps}, () => new Set());
let noteList = buildNoteList(2);  // [{name, midi, isBlack}, ...]
let pianoSampleBuffer = null;

const synthParams = {
  wave: 'sawtooth',
  attack: 5,
  decay: 80,
  sustain: 0.6,
  release: 200,
  detune: 0,
  octShift: 0,
  useSample: false,
};

// ─────────────────────────────────────────────
// Note Helpers
// ─────────────────────────────────────────────
const NOTE_NAMES = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const BLACK_IDX  = new Set([1,3,6,8,10]);

function buildNoteList(octaves) {
  const list = [];
  const topOct = 5;
  for (let o = topOct; o > topOct - octaves; o--) {
    for (let n = 11; n >= 0; n--) {
      list.push({ name: NOTE_NAMES[n] + o, midi: o * 12 + n, isBlack: BLACK_IDX.has(n) });
    }
  }
  return list;
}

function midiToHz(midi) { return 440 * Math.pow(2, (midi - 69) / 12); }

// ─────────────────────────────────────────────
// Drum Synthesis
// ─────────────────────────────────────────────
function noise(ctx, dur) {
  const buf = ctx.createBuffer(1, ctx.sampleRate * dur, ctx.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  const src = ctx.createBufferSource(); src.buffer = buf;
  return src;
}

function playDrumSynth(id, t) {
  const ctx = ensureCtx();
  switch (id) {
    case 'kick': {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.connect(g); g.connect(masterGain);
      o.type = 'sine';
      o.frequency.setValueAtTime(160, t);
      o.frequency.exponentialRampToValueAtTime(0.01, t + 0.5);
      g.gain.setValueAtTime(1.8, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.5);
      o.start(t); o.stop(t + 0.52);
      break;
    }
    case 'snare': {
      // Noise layer
      const n = noise(ctx, 0.25), ng = ctx.createGain(), nf = ctx.createBiquadFilter();
      nf.type = 'highpass'; nf.frequency.value = 1000;
      n.connect(nf); nf.connect(ng); ng.connect(masterGain);
      ng.gain.setValueAtTime(1.0, t); ng.gain.exponentialRampToValueAtTime(0.001, t + 0.2);
      n.start(t); n.stop(t + 0.25);
      // Tone layer
      const o = ctx.createOscillator(), og = ctx.createGain();
      o.connect(og); og.connect(masterGain);
      o.type = 'triangle'; o.frequency.value = 190;
      og.gain.setValueAtTime(0.8, t); og.gain.exponentialRampToValueAtTime(0.001, t + 0.12);
      o.start(t); o.stop(t + 0.15);
      break;
    }
    case 'hihat_c': {
      const n = noise(ctx, 0.1), g = ctx.createGain(), f = ctx.createBiquadFilter();
      f.type = 'highpass'; f.frequency.value = 8000;
      n.connect(f); f.connect(g); g.connect(masterGain);
      g.gain.setValueAtTime(0.6, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.08);
      n.start(t); n.stop(t + 0.1);
      break;
    }
    case 'hihat_o': {
      const n = noise(ctx, 0.4), g = ctx.createGain(), f = ctx.createBiquadFilter();
      f.type = 'highpass'; f.frequency.value = 7000;
      n.connect(f); f.connect(g); g.connect(masterGain);
      g.gain.setValueAtTime(0.5, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.35);
      n.start(t); n.stop(t + 0.4);
      break;
    }
    case 'clap': {
      [0, 0.01, 0.02].forEach(offset => {
        const n = noise(ctx, 0.15), g = ctx.createGain(), f = ctx.createBiquadFilter();
        f.type = 'bandpass'; f.frequency.value = 1100; f.Q.value = 0.4;
        n.connect(f); f.connect(g); g.connect(masterGain);
        const tt = t + offset;
        g.gain.setValueAtTime(0.7, tt); g.gain.exponentialRampToValueAtTime(0.001, tt + 0.12);
        n.start(tt); n.stop(tt + 0.15);
      });
      break;
    }
    case 'tom_h': {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.connect(g); g.connect(masterGain);
      o.type = 'sine';
      o.frequency.setValueAtTime(260, t); o.frequency.exponentialRampToValueAtTime(0.01, t + 0.35);
      g.gain.setValueAtTime(1.2, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.35);
      o.start(t); o.stop(t + 0.37);
      break;
    }
    case 'tom_l': {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.connect(g); g.connect(masterGain);
      o.type = 'sine';
      o.frequency.setValueAtTime(130, t); o.frequency.exponentialRampToValueAtTime(0.01, t + 0.45);
      g.gain.setValueAtTime(1.2, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.45);
      o.start(t); o.stop(t + 0.47);
      break;
    }
    case 'bass': {
      const o = ctx.createOscillator(), g = ctx.createGain(), f = ctx.createBiquadFilter();
      f.type = 'lowpass'; f.frequency.value = 300;
      o.connect(f); f.connect(g); g.connect(masterGain);
      o.type = 'sawtooth'; o.frequency.setValueAtTime(90, t); o.frequency.exponentialRampToValueAtTime(45, t + 0.3);
      g.gain.setValueAtTime(1.0, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.32);
      o.start(t); o.stop(t + 0.35);
      break;
    }
  }
}

function playDrum(id, t) {
  if (drumSamples[id]) {
    const ctx = ensureCtx();
    const src = ctx.createBufferSource();
    src.buffer = drumSamples[id];
    src.connect(masterGain);
    src.start(t);
  } else {
    playDrumSynth(id, t);
  }
}

// ─────────────────────────────────────────────
// Piano Synth
// ─────────────────────────────────────────────
function playNote(midi, startTime, duration) {
  const ctx = ensureCtx();
  const freq = midiToHz(midi + synthParams.octShift * 12);
  const { attack:atk, decay:dec, sustain:sus, release:rel, detune, wave, useSample } = synthParams;

  if (useSample && pianoSampleBuffer) {
    const src = ctx.createBufferSource();
    src.buffer = pianoSampleBuffer;
    src.playbackRate.value = freq / 261.63;
    src.detune.value = detune;
    const g = ctx.createGain();
    src.connect(g); g.connect(masterGain);
    const a = atk/1000, r = rel/1000;
    g.gain.setValueAtTime(0, startTime);
    g.gain.linearRampToValueAtTime(0.8, startTime + a);
    g.gain.linearRampToValueAtTime(0, startTime + duration + r);
    src.start(startTime);
    src.stop(startTime + duration + r + 0.05);
    return;
  }

  const osc = ctx.createOscillator();
  const g = ctx.createGain();
  osc.connect(g); g.connect(masterGain);
  osc.type = wave;
  osc.frequency.value = freq;
  osc.detune.value = detune;

  const a = atk/1000, d = dec/1000, r = rel/1000;
  g.gain.setValueAtTime(0, startTime);
  g.gain.linearRampToValueAtTime(0.8, startTime + a);
  g.gain.linearRampToValueAtTime(sus * 0.8, startTime + a + d);
  g.gain.setValueAtTime(sus * 0.8, startTime + duration);
  g.gain.linearRampToValueAtTime(0, startTime + duration + r);
  osc.start(startTime);
  osc.stop(startTime + duration + r + 0.05);
}

// ─────────────────────────────────────────────
// Transport / Scheduler
// ─────────────────────────────────────────────
function stepDuration(step) {
  const base = 60 / state.bpm / 4;
  // Swing: odd steps are delayed by swing%
  if (state.swing > 0 && step % 2 === 1) return base * (1 + state.swing / 100);
  return base;
}

function scheduler() {
  const ctx = ensureCtx();
  while (state.nextNoteTime < ctx.currentTime + SCHEDULE_SEC) {
    const step = (state.currentStep + 1) % state.steps;
    const t = state.nextNoteTime;
    const dur = stepDuration(step);

    // Drums
    CHANNELS.forEach(ch => { if (drumPat[ch.id][step]) playDrum(ch.id, t); });

    // Piano
    pianoNotes[step].forEach(midi => playNote(midi, t, dur * 0.85));

    // UI update
    const delay = (t - ctx.currentTime) * 1000;
    setTimeout(() => updatePlayhead(step), Math.max(0, delay));

    state.currentStep = step;
    state.nextNoteTime += dur;
  }
}

function onPlay() {
  const ctx = ensureCtx();
  if (state.isPlaying) return;
  state.isPlaying = true;
  state.currentStep = -1;
  state.nextNoteTime = ctx.currentTime + 0.05;
  state.timerID = setInterval(scheduler, LOOKAHEAD_MS);
  document.getElementById('btn-play').classList.add('active');
}

function onStop() {
  state.isPlaying = false;
  if (state.timerID) { clearInterval(state.timerID); state.timerID = null; }
  updatePlayhead(-1);
  document.getElementById('step-indicator').textContent = 'STEP 1 / ' + state.steps;
  document.getElementById('btn-play').classList.remove('active');
}

function setBpm(v) {
  state.bpm = v;
  document.getElementById('bpm-val').textContent = v;
}

function updatePlayhead(step) {
  document.querySelectorAll('.playhead').forEach(el => el.classList.remove('playhead'));
  if (step < 0) return;
  document.querySelectorAll(`[data-step="${step}"]`).forEach(el => el.classList.add('playhead'));
  document.getElementById('step-indicator').textContent = `STEP ${step + 1} / ${state.steps}`;
}

// ─────────────────────────────────────────────
// Drum Sequencer UI
// ─────────────────────────────────────────────
function buildDrumSeq() {
  const container = document.getElementById('drum-seq');
  container.innerHTML = '';

  // Step numbers
  const numRow = document.createElement('div');
  numRow.className = 'step-nums';
  for (let b = 0; b < state.steps / 4; b++) {
    const bg = document.createElement('div');
    bg.className = 'beat-nums';
    for (let s = 0; s < 4; s++) {
      const n = document.createElement('div');
      n.className = 'step-num';
      n.textContent = b * 4 + s + 1;
      n.style.color = s === 0 ? '#58a6ff' : '#30363d';
      bg.appendChild(n);
    }
    numRow.appendChild(bg);
    if (b < state.steps / 4 - 1) {
      const sp = document.createElement('div'); sp.style.width = '5px';
      numRow.appendChild(sp);
    }
  }
  container.appendChild(numRow);

  CHANNELS.forEach(ch => {
    const row = document.createElement('div');
    row.className = 'seq-channel';

    const label = document.createElement('div');
    label.className = 'ch-label';
    label.textContent = ch.label;
    label.style.color = ch.color;
    row.appendChild(label);

    const beatsWrap = document.createElement('div');
    beatsWrap.className = 'beats-wrap';

    for (let b = 0; b < state.steps / 4; b++) {
      const beatGrp = document.createElement('div');
      beatGrp.className = 'beat-group';
      for (let s = 0; s < 4; s++) {
        const stepIdx = b * 4 + s;
        const btn = document.createElement('div');
        btn.className = 'step-btn';
        btn.dataset.step = stepIdx;
        btn.dataset.ch = ch.id;
        if (drumPat[ch.id][stepIdx]) {
          btn.classList.add('on');
          btn.style.background = ch.color;
          btn.style.boxShadow = `0 0 8px ${ch.color}80`;
        }
        btn.addEventListener('click', () => {
          ensureCtx();
          const on = !drumPat[ch.id][stepIdx];
          drumPat[ch.id][stepIdx] = on ? 1 : 0;
          btn.classList.toggle('on', on);
          btn.style.background = on ? ch.color : '';
          btn.style.boxShadow = on ? `0 0 8px ${ch.color}80` : '';
          if (on) playDrum(ch.id, actx.currentTime + 0.01);
        });
        beatGrp.appendChild(btn);
      }
      beatsWrap.appendChild(beatGrp);

      if (b < state.steps / 4 - 1) {
        const sp = document.createElement('div'); sp.style.width = '5px';
        beatsWrap.appendChild(sp);
      }
    }
    row.appendChild(beatsWrap);

    // Per-row controls
    const ctrl = document.createElement('div');
    ctrl.className = 'ch-controls';

    const clrBtn = document.createElement('button');
    clrBtn.className = 'btn-sm'; clrBtn.textContent = 'CL';
    clrBtn.title = 'Clear row';
    clrBtn.onclick = () => {
      drumPat[ch.id].fill(0);
      beatsWrap.querySelectorAll('.step-btn').forEach(b => {
        b.classList.remove('on'); b.style.background = ''; b.style.boxShadow = '';
      });
    };
    ctrl.appendChild(clrBtn);

    const fileIn = document.createElement('input');
    fileIn.type = 'file'; fileIn.accept = '.wav,.mp3,.ogg,.flac'; fileIn.style.display = 'none';
    fileIn.onchange = async e => {
      const f = e.target.files[0]; if (!f) return;
      const ctx = ensureCtx();
      const buf = await ctx.decodeAudioData(await f.arrayBuffer());
      drumSamples[ch.id] = buf;
      wavBtn.textContent = '🎵 WAV';
      wavBtn.classList.add('loaded');
      wavBtn.title = f.name;
    };

    const wavBtn = document.createElement('button');
    wavBtn.className = 'btn-sm'; wavBtn.textContent = '📂 WAV';
    wavBtn.title = 'Load WAV sample';
    wavBtn.onclick = () => fileIn.click();
    ctrl.appendChild(fileIn);
    ctrl.appendChild(wavBtn);

    row.appendChild(ctrl);
    container.appendChild(row);
  });
}

  }

function applyDrumPreset(name) {
  CHANNELS.forEach(ch => drumPat[ch.id].fill(0));
  const p = DRUM_PRESETS[name] || {};
  Object.entries(p).forEach(([id, arr]) => {
    arr.forEach((v, i) => { if (i < state.steps) drumPat[id][i] = v; });
  });
  buildDrumSeq();
}

function randomizeDrums() {
  CHANNELS.forEach(ch => {
    for (let i = 0; i < state.steps; i++) {
      drumPat[ch.id][i] = Math.random() < 0.22 ? 1 : 0;
    }
  });
  buildDrumSeq();
}

// ─────────────────────────────────────────────
// Piano Roll UI
// ─────────────────────────────────────────────
function buildPianoRoll() {
  const keysEl = document.getElementById('piano-keys');
  const gridEl = document.getElementById('pr-grid');
  const numsEl = document.getElementById('pr-step-nums');
  keysEl.innerHTML = ''; gridEl.innerHTML = ''; numsEl.innerHTML = '';

  // Step numbers
  for (let s = 0; s < state.steps; s++) {
    const el = document.createElement('div');
    el.className = 'pr-snum';
    el.textContent = s + 1;
    el.style.color = s % 4 === 0 ? '#58a6ff' : '#30363d';
    numsEl.appendChild(el);
  }

  noteList.forEach(note => {
    // Key
    const key = document.createElement('div');
    key.className = 'p-key ' + (note.isBlack ? 'black' : 'white');
    key.textContent = note.name;
    key.id = 'pk-' + note.midi;
    key.addEventListener('mousedown', () => {
      ensureCtx();
      key.classList.add('trigger');
      playNote(note.midi, actx.currentTime, 0.4);
    });
    key.addEventListener('mouseup', () => key.classList.remove('trigger'));
    key.addEventListener('mouseleave', () => key.classList.remove('trigger'));
    keysEl.appendChild(key);

    // Grid row
    const row = document.createElement('div');
    row.className = 'pr-row ' + (note.isBlack ? 'black' : 'white');

    for (let s = 0; s < state.steps; s++) {
      const cell = document.createElement('div');
      cell.className = 'pr-cell' + (s % 4 === 0 ? ' beat-left' : '');
      cell.dataset.step = s;
      cell.dataset.midi = note.midi;
      if (pianoNotes[s].has(note.midi)) cell.classList.add('on');

      cell.addEventListener('click', () => {
        ensureCtx();
        if (pianoNotes[s].has(note.midi)) {
          pianoNotes[s].delete(note.midi);
          cell.classList.remove('on');
        } else {
          pianoNotes[s].add(note.midi);
          cell.classList.add('on');
          playNote(note.midi, actx.currentTime, 0.3);
        }
      });
      row.appendChild(cell);
    }
    gridEl.appendChild(row);
  });
}

// ─────────────────────────────────────────────
// Piano Presets
// ─────────────────────────────────────────────
const PIANO_PRESETS = {
  melody1:  [[60],[62],[64],[65],[67],[65],[64],[62],[60],[60],[62],[64],[62],[60],[],[60]],
  arpeggio: [[60],[64],[67],[72],[60],[64],[67],[72],[62],[65],[69],[74],[62],[65],[69],[74]],
  blues:    [[60],[],[63],[],[65],[66],[65],[63],[60],[],[63],[],[67],[],[65],[63]],
};

function applyPianoPreset(name) {
  clearPiano();
  const p = PIANO_PRESETS[name] || [];
  p.forEach((midis, step) => {
    if (step >= state.steps) return;
    midis.forEach(midi => {
      pianoNotes[step].add(midi);
      const el = document.querySelector(`.pr-cell[data-step="${step}"][data-midi="${midi}"]`);
      if (el) el.classList.add('on');
    });
  });
}

function clearPiano() {
  pianoNotes.forEach(s => s.clear());
  document.querySelectorAll('.pr-cell.on').forEach(el => el.classList.remove('on'));
}

// ─────────────────────────────────────────────
// Steps / Octaves
// ─────────────────────────────────────────────
function setSteps(n) {
  onStop();
  const wasMore = n > state.steps;
  state.steps = n;

  // Resize drum patterns
  CHANNELS.forEach(ch => {
    const old = drumPat[ch.id];
    const next = new Uint8Array(n);
    next.set(old.slice(0, n));
    drumPat[ch.id] = next;
  });

  // Resize piano notes
  if (wasMore) {
    while (pianoNotes.length < n) pianoNotes.push(new Set());
  } else {
    pianoNotes = pianoNotes.slice(0, n);
  }

  buildDrumSeq();
  buildPianoRoll();
}

function setOctaves(n) {
  noteList = buildNoteList(n);
  buildPianoRoll();
}

// ─────────────────────────────────────────────
// WAV Sample (Piano)
// ─────────────────────────────────────────────
async function loadPianoSample(input) {
  const f = input.files[0]; if (!f) return;
  const ctx = ensureCtx();
  pianoSampleBuffer = await ctx.decodeAudioData(await f.arrayBuffer());
  document.getElementById('piano-sample-name').textContent = f.name;
  document.getElementById('use-sample').checked = true;
  synthParams.useSample = true;
}

// ─────────────────────────────────────────────
// Misc
// ─────────────────────────────────────────────
function clearAll() {
  CHANNELS.forEach(ch => drumPat[ch.id].fill(0));
  buildDrumSeq();
  clearPiano();
}

function switchTab(tab) {
  document.querySelectorAll('.tab').forEach((el, i) => {
    el.classList.toggle('active', (i === 0) === (tab === 'drums'));
  });
  document.getElementById('panel-drums').classList.toggle('active', tab === 'drums');
  document.getElementById('panel-piano').classList.toggle('active', tab === 'piano');
}

// ─────────────────────────────────────────────
buildDrumSeq();
buildPianoRoll();
applyDrumPreset('basic');
